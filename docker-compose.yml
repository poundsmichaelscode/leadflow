services:
  postgres:
    image: postgres:17-alpine
    container_name: lead-manager-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: lead_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - lead_manager_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lead_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lead_manager_postgres_data:

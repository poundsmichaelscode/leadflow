services:
  postgres:
    image: postgres:17-alpine
    container_name: lead-manager-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: lead_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - lead_manager_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lead_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    container_name: lead-manager-api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lead_manager?schema=public
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000

    ports:
      - "4000:4000"

    depends_on:
      postgres:
        condition: service_healthy

    command: >
      sh -c "
      npx prisma migrate deploy --config prisma7.config.ts &&
      node dist/server.js
      "

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:4000/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000

    container_name: lead-manager-web
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000

    ports:
      - "3000:3000"

    depends_on:
      api:
        condition: service_healthy

volumes:
  lead_manager_postgres_data:

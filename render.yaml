services:
  - type: web
    name: leadflow-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main

    buildCommand: >
      npm ci &&
      npm run prisma:generate --workspace=apps/api &&
      npm run build --workspace=apps/api

    startCommand: >
      npm run start:prod --workspace=apps/api

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: leadflow-db
          property: connectionString

      - key: CORS_ORIGIN
        sync: false

databases:
  - name: leadflow-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: leadflow
